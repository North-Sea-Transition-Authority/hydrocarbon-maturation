database.url=jdbc:postgresql://${REMI_DATABASE_URL}
schema.password=${REMI_DATABASE_PASSWORD}

saml.entity-id=${REMI_SAML_ENTITY_ID}
saml.login-url=${REMI_SAML_LOGIN_URL}
saml.certificate=${REMI_SAML_CERTIFICATE}

saml.consumer-service-location=${REMI_SAML_BASE_URL}${server.servlet.context-path}/login/saml2/sso/saml

spring.flyway.out-of-order=${REMI_ENABLE_FLYWAY_OUT_OF_ORDER:false}

# Error properties
service.error.stack-trace-enabled=false