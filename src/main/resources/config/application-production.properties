database.url=jdbc:postgresql://${REMI_DATABASE_URL}
schema.password=${REMI_DATABASE_PASSWORD}

saml.entity-id=${REMI_SAML_ENTITY_ID}
saml.login-url=${REMI_SAML_LOGIN_URL}
saml.certificate=${REMI_SAML_CERTIFICATE}

saml.consumer-service-location=${REMI_SAML_BASE_URL}${server.servlet.context-path}/login/saml2/sso/saml

spring.flyway.out-of-order=${REMI_ENABLE_FLYWAY_OUT_OF_ORDER:false}

# S3
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket-name=${S3_BUCKET_NAME}
s3.endpoint=${S3_ENDPOINT:s3.eu-west-2.amazonaws.com}
s3.region-name=${S3_REGION_NAME:eu-west-2}
s3.disable-ssl=${S3_DISABLE_SSL:false}
s3.proxy-host=${S3_PROXY_HOST:}
s3.proxy-port=${S3_PROXY_PORT:}

# ClamAV
clamav.host=${CLAMAV_HOST}
clamav.port=${CLAMAV_PORT}
clamav.timeout=${CLAMAV_TIMEOUT}

# File upload
file-upload.max-allowed-size=${FILE_UPLOAD_MAX_ALLOWED_SIZE}
file-upload.allowed-extensions=${FILE_UPLOAD_ALLOWED_EXTENSIONS}

# Error properties
service.error.stack-trace-enabled=${REMI_ENABLE_STACK_TRACE}

# Energy Portal
energy-portal.api.url=${REMI_ENERGY_PORTAL_API_URL}
energy-portal.api.token=${REMI_ENERGY_PORTAL_API_TOKEN}

energy-portal.logout-url=${REMI_ENERGY_PORTAL_LOGOUT_URL}
energy-portal.portal-logout-pre-shared-key=${REMI_ENERGY_PORTAL_LOGOUT_KEY}
energy-portal.registration-url=${REMI_ENERGY_PORTAL_REGISTRATION_URL}

energy-portal.access-api.base-url=${REMI_ENERGY_PORTAL_TEAM_ACCESS_API_BASE_URL}
energy-portal.access-api.token=${REMI_ENERGY_PORTAL_TEAM_ACCESS_API_TOKEN}

# Email properties
email.mode=${REMI_EMAIL_MODE:production}
email.test-recipient-list=${REMI_EMAIL_TEST_RECIPIENT:}

# Fivium Notify
fivium.notify.notify-api-key=${NOTIFY_API_KEY}
fivium.notify.callback-token=${NOTIFY_CALLBACK_TOKEN}