# File upload library
file-upload.s3.access-key=
file-upload.s3.secret-token=
file-upload.s3.default-bucket=remi-dev
file-upload.s3.endpoint=localhost:9090
file-upload.s3.signing-region=
file-upload.s3.disable-ssl=true
file-upload.s3.proxy.host=
file-upload.s3.proxy.port=
file-upload.clamav.host=localhost
file-upload.clamav.port=3310
file-upload.clamav.timeout=PT1M

# Error properties
service.error.stack-trace-enabled=true

# Energy Portal
energy-portal.api.url=${itportal-base-url}/portal-api/graphql
energy-portal.api.token=remi-dev

energy-portal.logout-url=${itportal-base-url}/accounts/service-provider-sign-out
energy-portal.portal-logout-pre-shared-key=dev
energy-portal.registration-url=${itportal-base-url}/accounts/register

# Email properties
email.mode=test
email.test-recipient-list=${REMI_EMAIL_TEST_RECIPIENT}

# Fivium Notify
fivium.notify.notify-api-key=${NOTIFY_API_KEY}
# test bearer token to authenticate Notify callback requests
fivium.notify.callback-token=test-token!1

# Notification library
digital-notification-library.mode=test

# Feedback management service
fms.url-base=${itportal-base-url}/fmsdev
fms.presharedKey=dev

# Key to access API for publishing ReMI data (ReMI -> Energy Portal API)
remi.api.pre-shared-key=dev1

# enable or disable the statsd export, e.g. enable in prod and disable in local dev
management.statsd.metrics.export.enabled=false

# Analytics
analytics.serviceAnalyticIdentifier=G-7KKXDXD1WJ
analytics.energyPortalAnalyticIdentifier=G-QLX4YRDD0K

# Controls if new fields and field submissions can be created in the service
remi.fields.allow_submissions=true

actuator.admin-user-password=dev

# Energy Portal Accounts Service
energy-portal-accounts.preshared-key=dev1