server.servlet.context-path=${REMI_CONTEXT_PATH:/remi}

# Service branding
branding.service.name=Resource Maturation Interface
branding.service.mnemonic=ReMI

branding.customer.name=North Sea Transition Authority
branding.customer.mnemonic=NSTA

technical-support.contact.name=UKOP service desk
technical-support.contact.phone-number=0300 067 1682
technical-support.contact.email-address=ukop@nstauthority.co.uk

business-support.contact.name=${branding.customer.mnemonic}
business-support.contact.email-address=remisupport@nstauthority.co.uk

# Freemarker
spring.freemarker.settings.output_format=HTMLOutputFormat
spring.freemarker.settings.template_exception_handler=rethrow
spring.freemarker.suffix=.ftl

# Datasource
spring.datasource.url=${database.url}
spring.datasource.username=remi_app
spring.datasource.password=${schema.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${database.schema}

# Hibernate 6.2 changed the default of false to true incorrectly. Manually set the value
# back to restore previous default https://hibernate.atlassian.net/browse/HHH-16935.
# Without this you cannot inject dependencies into the AuditRevisionListener
spring.jpa.properties.hibernate.cdi.extensions=false

# Database
database.schema=remi

#Spring Session properties
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=${database.schema}.SPRING_SESSION
server.servlet.session.timeout=180m

# Don't allow queries to be executed in views or entities to be automatically flushed outside of an explicit transaction
spring.jpa.open-in-view=false

# Flyway
spring.flyway.schemas=${database.schema}
spring.flyway.placeholders.application-schema=${spring.flyway.schemas}

# SAML
saml.registration-id=saml
saml.portal-logout-pre-shared-key=${saml.portal-logout-pre-shared-key}

# File upload library
file-upload.s3.access-key=${S3_ACCESS_TOKEN}
file-upload.s3.secret-token=${S3_SECRET_TOKEN}
file-upload.s3.default-bucket=${S3_DEFAULT_BUCKET}
file-upload.s3.endpoint=${S3_ENDPOINT:s3.eu-west-2.amazonaws.com}
file-upload.s3.signing-region=${S3_SIGNING_REGION:eu-west-2}
file-upload.s3.proxy.host=${S3_PROXY_HOST}
file-upload.s3.proxy.port=${S3_PROXY_PORT}
file-upload.default-maximum-file-size=${FILE_UPLOAD_MAX_ALLOWED_SIZE:50MB}
file-upload.default-permitted-file-extensions=${FILE_UPLOAD_ALLOWED_EXTENSIONS:bmp, csv, doc, docx, jpeg, jpg, pdf, png, txt, xls, xlsx, zip}
file-upload.clamav.host=${CLAMAV_HOST}
file-upload.clamav.port=${CLAMAV_PORT}
file-upload.clamav.timeout=PT1M
spring.servlet.multipart.max-file-size=${file-upload.default-maximum-file-size}
spring.servlet.multipart.max-request-size=${spring.servlet.multipart.max-file-size}


# Email
email.callback-email=ukop@nstauthority.co.uk

# Feedback management service
fms.url-base=${FMS_URL_BASE}
fms.saveFeedbackUrl=${FMS_SUBMIT_ENDPOINT:/api/v1/save-feedback}
fms.connectionTimeout=${FMS_CONNECTION_TIMEOUT:20}
fms.presharedKey=${FMS_PRESHARED_KEY}
fms.service-name=REMI

# Accessibility statement configuration
accessibility.statementPreparedDate = 05 May 2023
accessibility.statementLastReviewDate = 05 May 2023
accessibility.serviceLastTestDate = 19 January 2023
accessibility.serviceLastTestedBy = Fivium Ltd
accessibility.designSystemLastTestedOnDate = 10 November 2020

energy-portal.access-api.resource_type=REMI_ACCESS_TEAM
energy-portal.access-api.privilege_name=REMI_ACCESS_PRIVILEGE

# Monitoring
management.statsd.metrics.export.enabled=${REMI_ENABLE_STATSD:false}
management.statsd.metrics.export.host=${REMI_STATSD_HOST:}
management.statsd.metrics.export.port=${REMI_STATSD_PORT:}
management.statsd.metrics.export.flavor=DATADOG
management.metrics.tags.instance=${REMI_METRICS_INSTANCE_TAG:}
management.metrics.tags.source-type=${REMI_METRICS_ENVIRONMENT_NAME:}
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Digital notification library
digital-notification-library.govuk-notify.api-key=${NOTIFY_API_KEY:}
digital-notification-library.test-mode.email-recipients=${REMI_EMAIL_TEST_RECIPIENT:}
# Test mode requires a sms recipient regardless of if you need sms. As we don't send sms default to a random number.
digital-notification-library.test-mode.sms-recipients=0123456789