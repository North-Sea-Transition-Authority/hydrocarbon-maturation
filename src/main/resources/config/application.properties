server.servlet.context-path=${REMI_CONTEXT_PATH:/remi}

# Service branding
branding.service.name=Resource Maturation Interface
branding.service.mnemonic=ReMI

branding.customer.name=North Sea Transition Authority
branding.customer.mnemonic=NSTA

# Freemarker
spring.freemarker.settings.output_format=HTMLOutputFormat
spring.freemarker.settings.template_exception_handler=rethrow
spring.freemarker.suffix=.ftl

# Datasource
spring.datasource.url=${database.url}
spring.datasource.username=remi_app
spring.datasource.password=${schema.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=remi

# Don't allow queries to be executed in views or entities to be automatically flushed outside of an explicit transaction
spring.jpa.open-in-view=false

# Flyway
spring.flyway.schemas=remi

# SAML
saml.registration-id=saml

# S3
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket-name=${S3_BUCKET_NAME}
s3.endpoint=s3.eu-west-2.amazonaws.com
s3.region-name=eu-west-2

# ClamAV
clamav.host=${CLAMAV_HOST}
clamav.port=${CLAMAV_PORT}