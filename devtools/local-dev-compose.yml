version: '3.9'

services:

  remi-db:
    image: postgres:14.3-alpine
    ports:
      - "5432:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data
      - ./create_db_user.sh:/docker-entrypoint-initdb.d/create_db_user.sh:ro
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: remi

  s3mock:
    image: adobe/s3mock:2.1.28
    ports:
      - "9090:9090"
      - "9191:9191"
    environment:
      initialBuckets: remi-dev
      retainFilesOnExit: true
      root: ./s3data

  clamav:
    image: clamav/clamav:0.105
    ports:
      - "3310:3310"

volumes:
  db-volume: