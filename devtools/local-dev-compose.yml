version: '3.9'

services:

  local-db:
    image: postgres:14.3-alpine
    ports:
      - "5432:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data
      - source: ./create_db_user.sh
        target: /docker-entrypoint-initdb.d/create_db_user.sh
        type: bind
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: remi

  s3mock: s3mock
    image: adobe/s3mock:2.1.28
    ports:
      - "9090:9090"
      - "9191:9191"
    environment:
      initialBuckets: dev-test

volumes:
  db-volume: